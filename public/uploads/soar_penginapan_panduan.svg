<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1100" fill="url(#bg2)"/>
  <circle cx="720" cy="180" r="160" fill="#14b8a6" opacity="0.15"/>
  <circle cx="80" cy="980" r="200" fill="#2dd4bf" opacity="0.12"/>

  <!-- Top Badge -->
  <rect x="60" y="50" width="680" height="40" rx="8" fill="#0d9488" opacity="0.4"/>
  <text x="400" y="75" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">
    FASILITI &amp; PENGINAPAN KONTINJEN KPMBP • SOAR 2026
  </text>

  <!-- Header Title -->
  <text x="400" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    GARIS PANDUAN PENGINAPAN
  </text>
  <text x="400" y="185" fill="#5eead4" font-family="system-ui, sans-serif" font-size="16" font-weight="500" text-anchor="middle">
    Aturan Kolej Kediaman, Disiplin &amp; Kebajikan Peserta
  </text>

  <!-- Section 1 -->
  <g transform="translate(60, 230)">
    <rect width="680" height="140" rx="16" fill="url(#cardBg2)"/>
    <rect x="0" y="0" width="8" height="140" rx="4" fill="#0d9488"/>
    <text x="40" y="45" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">1. PENEMPATAN BLOK &amp; KUNCI BILIK</text>
    <text x="40" y="75" fill="#475569" font-family="system-ui, sans-serif" font-size="14">
      • Kontinjen Lelaki: Blok B1 (Aras 2 &amp; 3)
    </text>
    <text x="40" y="100" fill="#475569" font-family="system-ui, sans-serif" font-size="14">
      • Kontinjen Wanita: Blok B3 (Aras 1 &amp; 2) — Kunci diambil melalui warden.
    </text>
  </g>

  <!-- Section 2 -->
  <g transform="translate(60, 400)">
    <rect width="680" height="140" rx="16" fill="url(#cardBg2)"/>
    <rect x="0" y="0" width="8" height="140" rx="4" fill="#0284c7"/>
    <text x="40" y="45" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">2. WAKTU BERKURUNG (CURFEW) JAM 11:00 MALAM</text>
    <text x="40" y="75" fill="#475569" font-family="system-ui, sans-serif" font-size="14">
      Semua peserta wajib berada di dalam bilik masing-masing sebelum 11:00 malam.
    </text>
    <text x="40" y="100" fill="#475569" font-family="system-ui, sans-serif" font-size="14">
      Pemeriksaan kehadiran (roll-call) akan diketuai oleh warden setiap malam.
    </text>
  </g>

  <!-- Section 3 -->
  <g transform="translate(60, 570)">
    <rect width="680" height="140" rx="16" fill="url(#cardBg2)"/>
    <rect x="0" y="0" width="8" height="140" rx="4" fill="#f59e0b"/>
    <text x="40" y="45" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">3. DEWAN MAKAN &amp; KUPON MAKANAN</text>
    <text x="40" y="75" fill="#475569" font-family="system-ui, sans-serif" font-size="14">
      Sarapan: 06:30 - 08:00 Pagi | Makan Tengah Hari: 12:00 - 14:00 Petang
    </text>
    <text x="40" y="100" fill="#475569" font-family="system-ui, sans-serif" font-size="14">
      Makan Malam: 18:30 - 20:30 Malam. Tunjukkan kad kontinjen di kaunter.
    </text>
  </g>

  <!-- Emergency Box -->
  <g transform="translate(60, 750)">
    <rect width="680" height="180" rx="16" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="40" y="45" fill="#5eead4" font-family="system-ui, sans-serif" font-size="16" font-weight="800">
      BILIK GERAKAN KONTINJEN KPMBP (24 JAM):
    </text>
    <text x="40" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">
      Bilik Seminar 2, Aras 2 Blok Kediaman B
    </text>
    <text x="40" y="115" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="15">
      Talian Kecemasan &amp; Perubatan: En. Hafiz (+60 19-700 8926)
    </text>
    <text x="40" y="145" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="13">
      Kotak pertolongan cemas (first-aid kit) disediakan di bilik gerakan sepanjang masa.
    </text>
  </g>

  <text x="400" y="1040" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Urus Setia Kebajikan &amp; Logistik KPM Bandar Penawar
  </text>
</svg>
