        <!-- Staff Cards Grid in Mockup -->
        <g transform="translate(16, 62)">
          <!-- Staff 1 -->
          <rect x="0" y="0" width="125" height="42" rx="8" fill="#0f172a" stroke="#334155" />
          <circle cx="20" cy="21" r="12" fill="#6366f1" />
          <text x="38" y="18" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff">Muhammad Fazly</text>
          <text x="38" y="30" font-family="system-ui" font-size="9" fill="#94a3b8">ST001</text>

          <!-- Staff 2 -->
          <rect x="135" y="0" width="125" height="42" rx="8" fill="#0f172a" stroke="#334155" />
          <circle cx="155" cy="21" r="12" fill="#d97706" />
          <text x="173" y="18" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff">Mohd Hakim</text>
          <text x="173" y="30" font-family="system-ui" font-size="9" fill="#94a3b8">ST002</text>

          <!-- Staff 3 -->
          <rect x="270" y="0" width="125" height="42" rx="8" fill="#0f172a" stroke="#334155" />
          <circle cx="290" cy="21" r="12" fill="#059669" />
          <text x="308" y="18" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff">Dr. Hj. Ahmad</text>
          <text x="308" y="30" font-family="system-ui" font-size="9" fill="#94a3b8">ST003</text>

          <!-- Staff 4 -->
          <rect x="405" y="0" width="125" height="42" rx="8" fill="#0f172a" stroke="#334155" />
          <circle cx="425" cy="21" r="12" fill="#ec4899" />
          <text x="443" y="18" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff">Alahar Bin Ali</text>
          <text x="443" y="30" font-family="system-ui" font-size="9" fill="#94a3b8">ST004</text>

          <!-- Staff Row 2 -->
          <rect x="0" y="52" width="125" height="42" rx="8" fill="#0f172a" stroke="#334155" />
          <circle cx="20" cy="73" r="12" fill="#0284c7" />
          <text x="38" y="70" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff">Norhasnah Binti</text>
          <text x="38" y="82" font-family="system-ui" font-size="9" fill="#94a3b8">ST010</text>

          <rect x="135" y="52" width="125" height="42" rx="8" fill="#0f172a" stroke="#334155" />
          <circle cx="155" cy="73" r="12" fill="#4f46e5" />
          <text x="173" y="70" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff">Nani Rahayu</text>
          <text x="173" y="82" font-family="system-ui" font-size="9" fill="#94a3b8">ST011</text>

          <rect x="270" y="52" width="125" height="42" rx="8" fill="#0f172a" stroke="#334155" />
          <circle cx="290" cy="73" r="12" fill="#10b981" />
          <text x="308" y="70" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff">Roslina Binti</text>
          <text x="308" y="82" font-family="system-ui" font-size="9" fill="#94a3b8">ST012</text>

          <rect x="405" y="52" width="125" height="42" rx="8" fill="#0f172a" stroke="#334155" />
          <circle cx="425" cy="73" r="12" fill="#a855f7" />
          <text x="443" y="70" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff">Nur Farhana</text>
          <text x="443" y="82" font-family="system-ui" font-size="9" fill="#94a3b8">ST015</text>
