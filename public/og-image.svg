<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="200" cy="150" r="300" fill="url(#glow)" />
  <circle cx="1000" cy="500" r="350" fill="url(#glow)" />

  <!-- Left Column - Marketing & Branding -->
  <g transform="translate(60, 50)">
    <!-- Brand Logo & Title -->
    <g transform="translate(0, 0)">
      <rect width="52" height="52" rx="16" fill="url(#brand)" />
      <!-- QR Icon inside logo -->
      <path d="M14 14h10v10H14zM28 14h10v10H28zM14 28h10v10H14zM28 28h4v4h-4zM34 34h4v4h-4zM34 28h4v4h-4zM28 34h4v4h-4z" fill="#ffffff" />
      <text x="68" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#ffffff">My Attendance</text>
    </g>

    <!-- Tagline -->
    <text x="0" y="86" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#818cf8">
      Platform Kehadiran Pintar Untuk Acara &amp; Organisasi
    </text>

    <!-- Headline -->
    <g transform="translate(0, 125)">
      <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" y="35">Pantau. Rekod.</text>
      <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="url(#text-gradient)" y="85">Analitik. Semua di</text>
      <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" y="135">Satu Platform.</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="310" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="15" fill="#94a3b8" width="480">
      <tspan x="0" dy="0">Urus kehadiran, imbasan QR, statistik real-time</tspan>
      <tspan x="0" dy="22">dan jalankan simulasi ujian pantas dengan mudah.</tspan>
    </text>

    <!-- 4 Feature Badges -->
    <g transform="translate(0, 365)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="105" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="28" font-family="system-ui" font-size="16" fill="#a855f7">📱</text>
      <text x="14" y="46" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">Imbasan QR</text>
      <text x="14" y="58" font-family="system-ui" font-size="9" fill="#64748b">Pantas &amp; Tepat</text>

      <!-- Badge 2 -->
      <rect x="115" y="0" width="105" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="129" y="28" font-family="system-ui" font-size="16" fill="#10b981">📅</text>
      <text x="129" y="46" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">Urus Event</text>
      <text x="129" y="58" font-family="system-ui" font-size="9" fill="#64748b">Mudah &amp; Teratur</text>

      <!-- Badge 3 -->
      <rect x="230" y="0" width="105" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="244" y="28" font-family="system-ui" font-size="16" fill="#f59e0b">📈</text>
      <text x="244" y="46" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">Statistik</text>
      <text x="244" y="58" font-family="system-ui" font-size="9" fill="#64748b">Real-time Data</text>

      <!-- Badge 4 -->
      <rect x="345" y="0" width="105" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="359" y="28" font-family="system-ui" font-size="16" fill="#38bdf8">⚡</text>
      <text x="359" y="46" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">Simulasi</text>
      <text x="359" y="58" font-family="system-ui" font-size="9" fill="#64748b">Ujian Imbasan</text>
    </g>

    <!-- Footer pill -->
    <g transform="translate(0, 465)">
      <rect x="0" y="0" width="220" height="32" rx="16" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <text x="16" y="20" font-family="system-ui" font-size="12" font-weight="600" fill="#34d399">✓ Selamat • Pantas • Dipercayai</text>
    </g>
