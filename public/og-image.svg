        <text x="338" y="52" font-family="system-ui" font-size="10" fill="#64748b">staf</text>

        <!-- Stat 4 -->
        <rect x="438" y="0" width="132" height="75" rx="12" fill="#1e293b" stroke="#334155" />
        <text x="452" y="24" font-family="system-ui" font-size="11" fill="#94a3b8">Jumlah Transaksi</text>
        <text x="452" y="52" font-family="system-ui" font-size="22" font-weight="800" fill="#f59e0b">12</text>
        <text x="482" y="52" font-family="system-ui" font-size="10" fill="#64748b">rekod</text>
      </g>

