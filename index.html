<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ClassAttend — Sistem Kehadiran Pelajar</title>

    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="ClassAttend — Sistem Kehadiran Pelajar" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicons & Apple Touch Icon (Official ClassAttend Assets) -->
    <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/ClassAttend/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/ClassAttend/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/ClassAttend/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/ClassAttend/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/ClassAttend/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/ClassAttend/apple-touch-icon.png" />

    <!-- Open Graph / Facebook / WhatsApp / Telegram Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClassAttend" />
    <meta property="og:description" content="ClassAttend — Sistem Kehadiran Pelajar" />
    <meta property="og:image" content="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/ClassAttend/OGI%20ClassAttend.jpg" />
    <meta property="og:image:alt" content="ClassAttend" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ClassAttend" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClassAttend" />
    <meta name="twitter:description" content="ClassAttend — Sistem Kehadiran Pelajar" />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/ClassAttend/OGI%20ClassAttend.jpg" />

    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClassAttend" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('PWA ServiceWorker registered successfully with scope:', reg.scope);
            },
            (err) => {
              console.warn('PWA ServiceWorker registration failed:', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
