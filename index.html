<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>STUDENT ATTEND - Sistem Kehadiran Pelajar Universal</title>

    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Sistem Pengurusan Kehadiran QR Pelajar Universal & Cloud Sync untuk Acara, Kuliah & Program Rasmi" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/StudentAttend/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/StudentAttend/android-chrome-192x192.png" />

    <!-- Open Graph / Facebook / WhatsApp / Telegram Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="STUDENT ATTEND - Platform Kehadiran Pelajar Pintar" />
    <meta property="og:description" content="Pantau. Rekod. Analitik. Urus kehadiran pelajar, imbasan QR, statistik real-time dan direktori pelajar kolej dengan mudah." />
    <meta property="og:image" content="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/StudentAttend/OGI%20StudentAttend.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="StudentAttend" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="STUDENT ATTEND - Platform Kehadiran Pelajar Pintar" />
    <meta name="twitter:description" content="Pantau. Rekod. Analitik. Urus kehadiran pelajar, imbasan QR, statistik real-time dan direktori pelajar kolej dengan mudah." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/syncrozz/syncrozz-assets/main/logo/StudentAttend/OGI%20StudentAttend.jpg" />

    <!-- iOS / Safari PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StudentAttend" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('PWA ServiceWorker registered successfully with scope:', reg.scope);
            },
            (err) => {
              console.warn('PWA ServiceWorker registration failed:', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
