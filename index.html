    <!-- Cache Busting for Browser Navigation -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <!-- Immediate Cache Busting & ServiceWorker Unregistration -->
    <script>
      (function() {
        // 1. Immediately wipe all browser cache storages
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          });
        }
        // 2. Unregister ALL service workers immediately
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        // 3. Remove legacy saved emails or stale sessions
        try {
          var saved = localStorage.getItem('classattend_saved_lecturer_email');
          if (saved && (saved.indexOf('bpenawar') !== -1 || saved.indexOf('@mara.gov.my') === -1)) {
            localStorage.removeItem('classattend_saved_lecturer_email');
          }
          var trusted = localStorage.getItem('syncrozz_trusted_access_v1');
          if (trusted && trusted.indexOf('bpenawar') !== -1) {
            localStorage.removeItem('syncrozz_trusted_access_v1');
            localStorage.removeItem('classattend_active_lecturer_v5');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

  </body>
